<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%236b2fa0%22/%3E%3C/svg%3E">
<meta name="description" content="Las Calles de las Mujeres en Realidad Aumentada — 10 años de Geochicas">
<title>Las Calles de las Mujeres · AR</title>
<link rel="preconnect" href="https://es.wikipedia.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --morado-950: #12061f;
    --morado-900: #1a0b2e;
    --morado-800: #2d1150;
    --morado-600: #6b2fa0;
    --morado-400: #a66ee8;
    --lila-200:   #e3d0ff;
    --lila-100:   #f3eaff;
    --magenta:    #ff3d9a;
    --ambar:      #ffc34d;
    --texto:      #fbf7ff;
    --texto-suave:#cdbbe6;
    --vidrio:     rgba(26, 11, 46, 0.78);
    --borde:      rgba(227, 208, 255, 0.22);
    --radio:      22px;
    --sombra:     0 24px 60px -12px rgba(8, 2, 18, 0.75);
    --fuente:     "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --titular:    "Space Grotesk", var(--fuente);
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--fuente);
    color: var(--texto);
    background: var(--morado-950);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, a { font: inherit; }

  /* ---------- Capa 0: cámara ---------- */
  #camara, #fondo {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #fondo {
    background:
      radial-gradient(120% 80% at 50% 110%, var(--morado-600) 0%, transparent 60%),
      radial-gradient(90% 60% at 10% 0%, #3b145f 0%, transparent 70%),
      var(--morado-950);
  }
  /* Orden de capas: fondo < cámara < su mundo < velo < escena < pie < dock < aviso < portada < hoja */
  #fondo { z-index: 0; }
  #camara { z-index: 1; opacity: 0; transition: opacity .6s ease; }
  #camara.activa { opacity: 1; }
  /* Velo para garantizar contraste del texto sobre cualquier imagen de cámara */
  .velo {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(180deg, rgba(18,6,31,.55) 0%, rgba(18,6,31,.15) 35%, rgba(18,6,31,.65) 100%);
  }

  /* ---------- Capa 1: escena AR (CSS 3D) ---------- */
  .escena {
    position: fixed; inset: 0; z-index: 4;
    display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(max(16px, env(safe-area-inset-bottom)) + 78px);
    perspective: 900px;
    perspective-origin: 50% 70%;
  }
  .ancla {
    /* La transformación la escribe JS a partir de la orientación del dispositivo */
    width: min(100%, 440px);
    transform-style: preserve-3d;
    will-change: transform;
    display: flex; flex-direction: column; align-items: center;
  }
  .flotador { width: 100%; animation: flotar 6s ease-in-out infinite; transform-style: preserve-3d; }
  @keyframes flotar {
    0%, 100% { transform: translate3d(0, 0, 40px); }
    50%      { transform: translate3d(0, -8px, 40px); }
  }

  /* Haz de luz + anillo: sugiere que el panel "brota" del QR en el suelo */
  .haz {
    width: 2px; height: 26px;
    background: linear-gradient(var(--lila-200), transparent);
    opacity: .7;
  }
  .anillo {
    width: 120px; height: 34px; border-radius: 50%;
    border: 2px solid var(--lila-200);
    box-shadow: 0 0 24px var(--morado-400), inset 0 0 18px var(--morado-400);
    transform: rotateX(60deg);
    animation: pulso-anillo 2.4s ease-out infinite;
  }
  .es-brecha .anillo { border-color: var(--magenta); box-shadow: 0 0 28px var(--magenta), inset 0 0 18px var(--magenta); }
  .es-brecha .haz { background: linear-gradient(var(--magenta), transparent); }
  @keyframes pulso-anillo {
    0%   { transform: rotateX(60deg) scale(.85); opacity: 1; }
    100% { transform: rotateX(60deg) scale(1.25); opacity: .25; }
  }

  /* ---------- Paneles ---------- */
  .panel {
    position: relative;
    background: var(--vidrio);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 22px 20px 20px;
    max-height: calc(100dvh - 230px);
    overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 14px;
    animation: aparecer .7s cubic-bezier(.2, .9, .3, 1.2) both;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(40px) rotateX(25deg) scale(.92); }
    to   { opacity: 1; transform: none; }
  }

  .etiqueta {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--lila-200);
  }
  .etiqueta::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--morado-400); box-shadow: 0 0 10px var(--morado-400);
  }
  .cabecera { display: flex; gap: 14px; align-items: center; }
  .retrato {
    flex: none; width: 64px; height: 64px; border-radius: 50%;
    object-fit: cover; object-position: top;
    border: 2px solid var(--lila-200);
    background: var(--morado-800);
  }
  h1 {
    font-family: var(--titular);
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    line-height: 1.08; letter-spacing: -.01em;
  }
  .subtitulo { color: var(--texto-suave); font-size: .95rem; margin-top: 4px; }
  .extracto {
    font-size: 1rem; line-height: 1.55; color: var(--lila-100);
    overflow-y: auto; overscroll-behavior: contain;
    padding-right: 4px;
    mask-image: linear-gradient(180deg, #000 85%, transparent);
    -webkit-mask-image: linear-gradient(180deg, #000 85%, transparent);
    padding-bottom: 12px;
  }
  .credito { font-size: .72rem; color: var(--texto-suave); opacity: .8; }
  .credito a { color: inherit; }

  .acciones { display: flex; flex-direction: column; gap: 10px; }
  .boton {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 14px 20px;
    border: 0; border-radius: 999px;
    font-weight: 600; font-size: 1rem; text-decoration: none; text-align: center;
    color: var(--morado-950);
    background: linear-gradient(135deg, var(--lila-100), var(--lila-200));
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .boton:active { transform: scale(.97); }
  .boton:focus-visible { outline: 3px solid var(--ambar); outline-offset: 3px; }
  .boton.secundario {
    color: var(--texto); background: transparent;
    border: 1.5px solid var(--borde);
  }
  .boton.texto { min-height: 40px; color: var(--texto-suave); background: none; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Info Box de BRECHA: prioridad visual máxima ---------- */
  .panel.brecha {
    background:
      linear-gradient(var(--morado-900), var(--morado-900)) padding-box,
      linear-gradient(var(--angulo, 135deg), var(--magenta), var(--ambar), var(--morado-400), var(--magenta)) border-box;
    border: 3px solid transparent;
    box-shadow: 0 0 0 1px rgba(255,61,154,.25), 0 0 60px -6px rgba(255,61,154,.55), var(--sombra);
    animation: aparecer .7s cubic-bezier(.2, .9, .3, 1.2) both, girar-borde 5s linear infinite;
  }
  @property --angulo { syntax: "<angle>"; inherits: false; initial-value: 135deg; }
  @keyframes girar-borde { to { --angulo: 495deg; } }

  .alerta {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--magenta); color: #fff;
    font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    animation: latido 1.6s ease-in-out infinite;
  }
  @keyframes latido { 50% { box-shadow: 0 0 0 8px rgba(255,61,154,0); } 0%, 100% { box-shadow: 0 0 0 0 rgba(255,61,154,.6); } }
  .mensaje-brecha {
    font-family: var(--titular);
    font-size: clamp(1.15rem, 5vw, 1.35rem); font-weight: 500; line-height: 1.35;
  }
  .mensaje-brecha strong { color: var(--ambar); font-weight: 700; }
  .dato-brecha {
    font-size: .88rem; color: var(--texto-suave);
    border-left: 3px solid var(--magenta); padding-left: 10px;
  }
  .brecha .boton:not(.secundario):not(.texto) {
    color: #fff;
    background: linear-gradient(135deg, var(--magenta), #c3248a);
    box-shadow: 0 10px 30px -8px rgba(255,61,154,.8);
  }

  /* ---------- Portada / permisos ---------- */
  .portada {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 18px;
    padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(107,47,160,.55), transparent 65%),
      linear-gradient(180deg, transparent, var(--morado-950) 70%),
      var(--morado-900);
    transition: opacity .4s ease, visibility .4s;
  }
  .portada.oculta { opacity: 0; visibility: hidden; }
  .sello {
    position: absolute; top: max(24px, env(safe-area-inset-top)); left: 20px;
    font-family: var(--titular); font-weight: 700; letter-spacing: .04em;
    display: flex; align-items: center; gap: 10px;
  }
  .sello span {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
    background: var(--lila-200); color: var(--morado-900); font-size: .95rem;
  }
  .portada h2 { font-family: var(--titular); font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.02; }
  .portada p { color: var(--texto-suave); line-height: 1.5; max-width: 34ch; }
  #calle-previa { color: var(--lila-200); font-weight: 600; min-height: 1.5em; }

  .aviso {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 8; max-width: calc(100% - 32px);
    padding: 8px 14px; border-radius: 999px;
    background: rgba(18,6,31,.8); border: 1px solid var(--borde);
    font-size: .8rem; color: var(--texto-suave); text-align: center;
  }
  .aviso:empty { display: none; }

  .cargando { display: flex; flex-direction: column; align-items: center; gap: 16px; color: var(--texto-suave); }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(227,208,255,.2); border-top-color: var(--lila-200);
    animation: girar 0.9s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- Su mundo: imágenes de contexto detrás de la tarjeta ---------- */
  .mundo {
    position: fixed; inset: -6%; z-index: 2; pointer-events: none;
    opacity: 0; transition: opacity .9s ease; will-change: transform;
  }
  .mundo.visible { opacity: 1; }
  .mundo figure { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity 1.8s ease; overflow: hidden; }
  .mundo figure.activa { opacity: 1; }
  .mundo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Efecto Ken Burns: la animación arranca de nuevo cada vez que la imagen se vuelve activa */
  .mundo figure.activa img.principal { animation: var(--kb) var(--kb-dur, 10s) ease-in-out forwards; }
  /* Con una sola imagen, el movimiento va y viene sin detenerse */
  .mundo.unica figure.activa img.principal { animation-iteration-count: infinite; animation-direction: alternate; --kb-dur: 16s; }
  @keyframes kb-acerca { from { transform: scale(1.04); } to { transform: scale(1.2) translate(-2%, -3%); } }
  @keyframes kb-aleja  { from { transform: scale(1.2) translate(2%, -2%); } to { transform: scale(1.04); } }
  /* Imágenes horizontales en pantalla vertical: paneo a lo largo de toda la imagen */
  @keyframes kb-paneo-der { from { object-position: 8% 50%; transform: scale(1.04); } to { object-position: 92% 50%; transform: scale(1.12); } }
  @keyframes kb-paneo-izq { from { object-position: 92% 50%; transform: scale(1.12); } to { object-position: 8% 50%; transform: scale(1.04); } }
  @keyframes kb-suave { from { transform: scale(1); } to { transform: scale(1.06); } }
  /* Imágenes pequeñas: foto enmarcada sobre una copia desenfocada de sí misma */
  .mundo figure.enmarcada img.difusa { filter: blur(28px) saturate(1.2); transform: scale(1.2); opacity: .75; }
  /* top/height los ajusta JS al hueco libre entre el pie de foto y la tarjeta */
  .mundo figure.enmarcada img.principal {
    left: 10%; width: 80%; top: 18%; height: 24%; object-fit: contain;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.6));
  }
  .mundo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(18,6,31,.25) 0%, rgba(18,6,31,0) 18%, rgba(18,6,31,.1) 38%, rgba(18,6,31,.8) 70%, rgba(18,6,31,.92) 100%);
  }
  .pie-mundo {
    position: fixed; z-index: 5; left: 16px; right: 16px; top: max(14px, env(safe-area-inset-top));
    display: none; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .pie-mundo.visible { display: flex; }
  .pie-mundo p {
    background: rgba(18,6,31,.74); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--borde); border-radius: 14px; padding: 8px 12px;
    font-size: .84rem; line-height: 1.35; color: var(--lila-100); max-width: 68%;
  }
  .pie-mundo p:empty { visibility: hidden; }
  .pie-mundo small { display: block; margin-top: 4px; font-size: .68rem; color: var(--texto-suave); }
  .pie-mundo small a { color: inherit; }
  .chip {
    flex: none; min-height: 40px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--borde); background: rgba(18,6,31,.74); color: var(--texto);
    font-size: .82rem; font-weight: 600; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .chip:focus-visible, .pestana:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }

  /* ---------- Tarjeta: pestañas, línea de tiempo, escuchar ---------- */
  .herramientas { display: flex; gap: 6px; align-items: center; }
  .pestana {
    min-height: 36px; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--borde); background: transparent; color: var(--texto-suave);
    font-size: .84rem; font-weight: 600;
  }
  .pestana[aria-selected="true"] { background: var(--lila-200); color: var(--morado-950); border-color: transparent; }
  .herramientas .escuchar { margin-left: auto; }
  .linea {
    list-style: none; margin: 0; padding: 2px 4px 8px 22px; position: relative;
    overflow-y: auto; overscroll-behavior: contain;
  }
  .linea::before {
    content: ""; position: absolute; left: 7px; top: 10px; bottom: 14px; width: 2px;
    background: linear-gradient(var(--lila-200), var(--morado-400));
  }
  .linea li { position: relative; padding: 4px 0 12px; line-height: 1.4; color: var(--lila-100); }
  .linea li::before {
    content: ""; position: absolute; left: -21px; top: 9px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--morado-950); border: 2px solid var(--lila-200);
  }
  .linea b { display: block; font-family: var(--titular); font-size: 1.1rem; color: var(--lila-200); }

  .marco-vacio {
    display: flex; gap: 12px; align-items: center;
    border: 2px dashed rgba(255,61,154,.65); border-radius: 16px; padding: 12px 14px;
    font-size: .88rem; line-height: 1.4; color: var(--lila-100);
  }
  .marco-vacio svg { flex: none; width: 46px; height: 46px; }
  .marco-vacio a { color: var(--ambar); font-weight: 600; }

  /* ---------- Dock: recorrido + siguiente calle en el mapa impreso ---------- */
  .dock {
    position: fixed; z-index: 6; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    display: none; gap: 8px;
  }
  .dock.visible { display: flex; }
  .dock button {
    min-height: 60px; padding: 8px 12px; border-radius: 18px; cursor: pointer; text-align: left;
    border: 1px solid var(--borde); background: rgba(18,6,31,.82); color: var(--texto);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .dock small { display: block; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-suave); }
  .dock strong { font-family: var(--titular); font-size: 1.05rem; }
  .dock .siguiente { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  #sig-nombre { display: block; font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flecha {
    flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--lila-200); color: var(--morado-950); transition: transform .3s ease;
  }
  .flecha svg { width: 22px; height: 22px; }
  .dock .siguiente > span:last-child { min-width: 0; }
  #sig-distancia { text-transform: none; letter-spacing: 0; font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Con imágenes de contexto: la tarjeta deja ver su mundo arriba y abajo */
  /* Con imágenes de contexto: la imagen ocupa la mitad de arriba y la tarjeta baja */
  body.con-mundo .escena { place-items: end center; }
  body.con-mundo .panel { max-height: min(50dvh, calc(100dvh - 330px)); background: rgba(26, 11, 46, 0.78); }
  body.con-mundo .haz, body.con-mundo .anillo { display: none; }
  body.con-mundo .cabecera .retrato { width: 52px; height: 52px; }

  /* El resumen y la línea de tiempo nunca se aplastan: si no caben, la tarjeta se desplaza */
  .panel .extracto, .panel .linea { flex: 0 0 auto; min-height: 5.2em; max-height: 34dvh; }

  /* Pantallas bajas o en horizontal: la tarjeta va a un lado y usa todo el alto */
  @media (max-height: 640px) and (min-width: 560px) {
    body.con-mundo .escena { place-items: center end; padding-top: calc(max(14px, env(safe-area-inset-top)) + 8px); }
    body.con-mundo .panel { max-height: calc(100dvh - 120px); width: min(440px, 58vw); }
    body.con-mundo .ancla { width: auto; }
    .pie-mundo p { max-width: 38%; }
  }

  /* ---------- Hoja del pasaporte ---------- */
  .hoja {
    position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 82dvh; overflow-y: auto;
    background: var(--morado-900); border-radius: 24px 24px 0 0; border-top: 1px solid var(--borde);
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .35s ease; box-shadow: 0 -20px 60px rgba(0,0,0,.5);
  }
  .hoja.abierta { transform: none; }
  .hoja h2 { font-family: var(--titular); font-size: 1.4rem; }
  .hoja h3 { font-size: .95rem; margin: 18px 0 8px; display: flex; justify-content: space-between; color: var(--lila-200); }
  .hoja ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .hoja li { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .92rem; }
  .hoja li.visitada::before { content: "✓"; color: var(--lila-200); font-weight: 700; margin-right: -2px; }
  .hoja li span { flex: 1; }
  .hoja li button, .hoja li a {
    min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: .78rem; font-weight: 600;
    border: 1px solid var(--borde); background: transparent; color: var(--texto); text-decoration: none; cursor: pointer;
  }
  .progreso { height: 8px; border-radius: 999px; background: rgba(227,208,255,.15); overflow: hidden; margin: 10px 0 4px; }
  .progreso div { height: 100%; background: linear-gradient(90deg, var(--morado-400), var(--lila-200)); }
  .hoja .cerrar { position: absolute; top: 14px; right: 14px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (min-height: 700px) { .panel { padding: 26px 24px 22px; } }
</style>
</head>
<body>

<video id="camara" autoplay playsinline muted aria-hidden="true"></video>
<div id="fondo" aria-hidden="true"></div>
<div id="mundo" class="mundo" aria-hidden="true"></div>
<div class="velo" aria-hidden="true"></div>
<div id="pie-mundo" class="pie-mundo">
  <p id="pie-texto" aria-live="polite"></p>
  <button class="chip" id="btn-mundo" type="button" aria-pressed="true">Ver cámara</button>
</div>

<div id="aviso" class="aviso" role="status"></div>

<main class="escena" id="escena">
  <div class="ancla" id="ancla">
    <div class="flotador" id="contenido">
      <div class="cargando"><div class="spinner"></div><span>Buscando su historia…</span></div>
    </div>
    <div class="haz" aria-hidden="true"></div>

<script type="module">
// ============================================================================
// Configuración
// ============================================================================
const CONFIG = {
  DATOS_URL: './calles_cdmx.json',
  WIKI_REST: 'https://es.wikipedia.org/api/rest_v1/page/summary/',
  WIKI_EDITAR: 'https://es.wikipedia.org/w/index.php',
  WIKIDATA_API: 'https://www.wikidata.org/w/api.php',
  AYUDA_PRIMER_ARTICULO: 'https://es.wikipedia.org/wiki/Ayuda:Tu_primer_art%C3%ADculo',
  PROYECTO_URL: 'https://geochicasosm.github.io/lascallesdelasmujeres/',
  SUBIR_COMMONS: 'https://commons.wikimedia.org/wiki/Special:UploadWizard?uselang=es',
  TIEMPO_MAX_MS: 7000,
  SEGUNDOS_POR_IMAGEN: 7,
  // Dónde está montado el mapa impreso. 'pared': la flecha señala arriba/abajo/izquierda/derecha sobre el
  // mapa (la brújula no sirve con el mapa vertical). 'piso': la flecha usa la brújula, calibrada con el QR.
  MONTAJE: 'piso',
  // Solo para MONTAJE 'piso'. Rumbo de brújula (0-360°) hacia donde apunta el NORTE del mapa impreso en la sala.
  // No hace falta medirlo: cada teléfono lo calcula solo al ver un QR del piso con la cámara
  // (ver calibrarConQR). Solo se escribe aquí para forzar un valor fijo.
  NORTE_MAPA_RUMBO: null,
  JSQR_URL: 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js',
  CLAVE_VISITAS: 'lcm.visitadas.v1',
  CLAVE_NORTE: 'lcm.norte-mapa.v1',
  HORAS_CALIBRACION: 24,
};

const MENSAJE_BRECHA =
  'Este artículo de Wikipedia aún no existe. La historia de esta mujer sigue invisibilizada ' +
  'en la enciclopedia libre. ¿Te gustaría ser quien lo escriba y cierre esta brecha?';

const $ = (sel) => document.querySelector(sel);
const contenido = $('#contenido');
const ancla = $('#ancla');

// Crea elementos sin innerHTML: todo texto externo (Wikipedia/JSON) entra como textContent.
function el(tag, attrs = {}, ...hijos) {
  const nodo = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') nodo.className = v;
    else if (k.startsWith('on')) nodo.addEventListener(k.slice(2), v);
    else nodo.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h != null) nodo.append(h);
  return nodo;
}

function enlaceExterno(texto, href, clase = 'boton') {
  return el('a', { class: clase, href, target: '_blank', rel: 'noopener' }, texto);
}

function avisar(texto) { $('#aviso').textContent = texto; }

// ============================================================================
// Paso A — Detección: leer ?calle_id= de la URL
// ============================================================================
function leerCalleId() {
  const id = new URLSearchParams(location.search).get('calle_id');
  return id && /^[a-z0-9-]{1,120}$/i.test(id) ? id.toLowerCase() : null;
}

// ============================================================================
// Paso B — Consulta de datos (JSON local + Wikipedia en vivo)
// ============================================================================
class SinRed extends Error {}

async function obtener(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), CONFIG.TIEMPO_MAX_MS);
  try {
    return await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
  } catch (e) {
    throw new SinRed(e.message); // sin conexión, timeout o CORS
  } finally {
    clearTimeout(t);
  }
}

async function cargarDatos() {
  const r = await obtener(CONFIG.DATOS_URL);
  if (!r.ok) throw new Error(`No se pudo leer ${CONFIG.DATOS_URL} (${r.status})`);
  return r.json();
}

// Devuelve el resumen si el artículo existe, o null si NO existe (404 / desambiguación).
// Lanza SinRed si no se pudo comprobar.
async function resumenWikipedia(titulo) {
  const r = await obtener(CONFIG.WIKI_REST + encodeURIComponent(titulo.replace(/ /g, '_')));
  if (r.status === 404) return null;
  if (!r.ok) throw new SinRed(`Wikipedia respondió ${r.status}`);
  const datos = await r.json();
  return datos.type === 'disambiguation' ? null : datos;
}

// Si el título del JSON no existe, pregunta a Wikidata si ya hay artículo en eswiki
// (por ejemplo, alguien lo escribió DESPUÉS de imprimir el mapa).
async function tituloDesdeWikidata(qid) {
  if (!qid) return null;
  const q = new URLSearchParams({
    action: 'wbgetentities', ids: qid, props: 'sitelinks', sitefilter: 'eswiki',
    format: 'json', origin: '*',
  });
  const r = await obtener(`${CONFIG.WIKIDATA_API}?${q}`);
  if (!r.ok) return null;
  const d = await r.json();
  return d.entities?.[qid]?.sitelinks?.eswiki?.title ?? null;
}

// ============================================================================
// Paso C — Condicional: ¿existe el artículo?
// ============================================================================
async function resolverArticulo(mujer) {
  try {
    let resumen = await resumenWikipedia(mujer.wikipedia_titulo);
    if (!resumen) {
      const titulo = await tituloDesdeWikidata(mujer.wikidata_id);
      if (titulo && titulo !== mujer.wikipedia_titulo) resumen = await resumenWikipedia(titulo);
    }
    return resumen ? { estado: 'existe', resumen } : { estado: 'no-existe' };
  } catch (e) {
    if (!(e instanceof SinRed)) throw e;
    // Sin conexión: recurrimos a lo verificado al generar el JSON.
    avisar('Sin conexión estable: mostrando datos guardados');
    if (mujer.tiene_articulo) {
      return {
        estado: 'existe',
        resumen: {
          title: mujer.wikipedia_titulo,
          extract: mujer.extracto_respaldo || 'Su biografía está disponible en Wikipedia.',
          content_urls: { mobile: { page: `https://es.m.wikipedia.org/wiki/${encodeURIComponent(mujer.wikipedia_titulo.replace(/ /g, '_'))}` } },
        },
      };
    }
    return { estado: 'no-existe' };
  }
}

// ============================================================================
// Render de la UI
// ============================================================================
function pintar(nodo, { brecha = false } = {}) {
  document.body.classList.toggle('es-brecha', brecha);
  contenido.replaceChildren(nodo);
}

// Se muestra el nombre corregido de la mujer (mujer.nombre), no el de OSM, que tiene erratas
// ("Calle Frida Kalho"). El subtítulo solo aparece si Wikipedia la conoce por otro nombre.
function subtitulo(calle, nombre) {
  const visible = calle.mujer.nombre;
  return visible.includes(nombre) || nombre.includes(visible)
    ? null
    : el('p', { class: 'subtitulo' }, `En honor a ${nombre}`);
}

function botonEscuchar(texto) {
  if (!('speechSynthesis' in window)) return null;
  return el('button', { class: 'pestana escuchar', type: 'button', 'aria-pressed': 'false', 'aria-label': 'Escuchar',
    onclick: (e) => escuchar(texto, e.currentTarget) }, '🔊');
}

function lineaDeTiempo(eventos) {
  return el('ol', { class: 'linea', 'aria-label': 'Línea de tiempo' },
    eventos.map((e) => el('li', {}, el('b', {}, String(e.anio)), e.texto)));
}

function panelArticulo(calle, resumen) {
  const url = resumen.content_urls?.mobile?.page || resumen.content_urls?.desktop?.page;
  const foto = resumen.thumbnail?.source;
  const historia = el('p', { class: 'extracto', id: 'vista-historia' }, resumen.extract);
  const eventos = calle.linea_tiempo || [];
  let herramientas;
  if (eventos.length) {
    const linea = lineaDeTiempo(eventos);
    linea.id = 'vista-tiempo';
    linea.hidden = true;
    const pestanas = [['Historia', historia], ['Línea de tiempo', linea]].map(([txt, vista], i) =>
      el('button', { class: 'pestana', type: 'button', role: 'tab', 'aria-selected': String(i === 0),
        'aria-controls': vista.id, onclick: (e) => {
          for (const p of pestanas) p.setAttribute('aria-selected', String(p === e.currentTarget));
          historia.hidden = vista !== historia;
          linea.hidden = vista !== linea;
        } }, txt));
    herramientas = el('div', { class: 'herramientas', role: 'tablist' }, pestanas,
      botonEscuchar(`${calle.mujer.nombre}. ${resumen.extract}`));
    return armarPanel(calle, resumen, url, foto, herramientas, [historia, linea]);
  }
  herramientas = el('div', { class: 'herramientas' }, botonEscuchar(`${calle.mujer.nombre}. ${resumen.extract}`));
  return armarPanel(calle, resumen, url, foto, herramientas, [historia]);
}

function armarPanel(calle, resumen, url, foto, herramientas, vistas) {
  return el('article', { class: 'panel', 'aria-labelledby': 'titulo-calle' },
    el('span', { class: 'etiqueta' }, 'Calle con nombre de mujer'),
    el('div', { class: 'cabecera' },
      foto && el('img', { class: 'retrato', src: foto, alt: `Retrato de ${calle.mujer.nombre}` }),
      el('div', {},
        el('h1', { id: 'titulo-calle' }, calle.mujer.nombre),
        subtitulo(calle, resumen.title),
      ),
    ),
    herramientas,
    vistas,
    el('div', { class: 'acciones' }, url && enlaceExterno('Leer artículo completo →', url)),
    el('p', { class: 'credito' },
      'Texto: ', el('a', { href: url, target: '_blank', rel: 'noopener' }, 'Wikipedia'),
      ' · CC BY-SA 4.0 · Datos: Geochicas / OpenStreetMap / Wikidata'),
  );
}

const ICONO_SIN_IMAGEN = `<svg viewBox="0 0 48 48" fill="none" stroke="#ff3d9a" stroke-width="2.5" aria-hidden="true">
  <rect x="5" y="9" width="38" height="30" rx="4" stroke-dasharray="5 4"/><circle cx="24" cy="21" r="6"/>
  <path d="M14 36c2-5 6-8 10-8s8 3 10 8"/></svg>`;

function marcoVacio() {
  const icono = el('span', { 'aria-hidden': 'true' });
  icono.innerHTML = ICONO_SIN_IMAGEN; // SVG fijo, no viene de datos externos
  return el('div', { class: 'marco-vacio' }, icono,
    el('p', {}, 'Tampoco hay ninguna imagen de ella en Wikimedia Commons. ¿Tienes una foto o un documento? ',
      el('a', { href: CONFIG.SUBIR_COMMONS, target: '_blank', rel: 'noopener' }, 'Súbelo')));
}

function panelBrecha(calle, datos) {
  const titulo = calle.mujer.wikipedia_titulo || calle.mujer.nombre;
  const crear = `${CONFIG.WIKI_EDITAR}?${new URLSearchParams({ title: titulo, action: 'edit', redlink: '1' })}`;

  const calles = Object.values(datos.calles || {});
  const sinArticulo = calles.filter((c) => !c.mujer.tiene_articulo).length;
  const dato = calles.length > 2
    ? el('p', { class: 'dato-brecha' },
        `En este mapa, ${sinArticulo} de ${calles.length} calles con nombre de mujer no tienen artículo en Wikipedia en español.`)
    : null;

  return el('article', { class: 'panel brecha', role: 'alert', 'aria-labelledby': 'titulo-calle' },
    el('span', { class: 'alerta' }, '⚠ Brecha de datos'),
    el('div', { class: 'herramientas' },
      el('h1', { id: 'titulo-calle' }, calle.mujer.nombre),
      botonEscuchar(`${calle.mujer.nombre}. ${MENSAJE_BRECHA}`),
    ),
    el('p', { class: 'mensaje-brecha' },
      'Este artículo de Wikipedia ', el('strong', {}, 'aún no existe'),
      '. La historia de esta mujer sigue invisibilizada en la enciclopedia libre. ',
      '¿Te gustaría ser quien lo escriba y cierre esta brecha?'),
    dato,
    calle.contexto?.length ? null : marcoVacio(),
    el('div', { class: 'acciones' },
      enlaceExterno('Escribir este artículo', crear),
      enlaceExterno('Entra al proyecto más amplio de Las Calles de las Mujeres', CONFIG.PROYECTO_URL, 'boton secundario'),
      enlaceExterno('¿Primera vez? Cómo crear un artículo', CONFIG.AYUDA_PRIMER_ARTICULO, 'boton texto'),
    ),
  );
}

function panelError(titulo, texto) {
  return el('article', { class: 'panel' },
    el('span', { class: 'etiqueta' }, 'Las Calles de las Mujeres'),
    el('h1', {}, titulo),
    el('p', { class: 'extracto' }, texto),
  );
}

// ============================================================================
// Cámara (getUserMedia) + anclaje por orientación del dispositivo
// ============================================================================
// Navegadores dentro de otras apps (Google Lens, Instagram, Facebook, WebView de Android…): suelen bloquear
// la cámara sin preguntar. Se detectan para ofrecer abrir la página en el navegador del teléfono.
function navegadorDentroDeApp() {
  const ua = navigator.userAgent;
  return /; wv\)|GSA\/|FBAN|FBAV|Instagram|Line\/|Snapchat|TikTok|musical_ly|Twitter/i.test(ua);
}

function enlaceAbrirEnNavegador() {
  if (/Android/i.test(navigator.userAgent)) {
    // Intent de Android: abre la misma URL en Chrome (o en el navegador por omisión si no hay Chrome)
    const sinEsquema = location.href.replace(/^https?:\/\//, '');
    return `intent://${sinEsquema}#Intent;scheme=https;package=com.android.chrome;` +
      `S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
  }
  return null; // en iOS no hay forma de forzarlo: se indica con texto
}

const diagnostico = { camara: 'sin intentar', orientacion: 'sin intentar', eventos: 0, intentos: 0 };

async function iniciarCamara() {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Este navegador no permite usar la cámara.');
  const pedir = (video) => navigator.mediaDevices.getUserMedia({ audio: false, video });
  let stream = null;
  // En Android la app de cámara que leyó el QR puede seguir usando la cámara unos instantes:
  // si está ocupada (NotReadableError / AbortError) se reintenta, y si la resolución pedida no
  // existe (OverconstrainedError) se pide cualquier cámara trasera.
  for (let intento = 1; intento <= 4 && !stream; intento++) {
    diagnostico.intentos = intento;
    try {
      stream = await pedir(intento < 3
        ? { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
        : { facingMode: 'environment' });
    } catch (e) {
      diagnostico.camara = `${e.name}: ${e.message}`;
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError' || intento === 4) throw e;
      await new Promise((r) => setTimeout(r, 700 * intento));
    }
  }
  diagnostico.camara = 'activa';
  const video = $('#camara');
  video.srcObject = stream;
  await video.play();
  video.classList.add('activa');
}

// El panel contra-rota cuando la persona inclina el teléfono, de modo que parece
// quedarse "suspendido" sobre el QR del suelo en lugar de pegado a la pantalla.
function iniciarAnclaje() {
  // Si el teléfono pide reducir movimiento (accesibilidad o ahorro de batería en algunos Android),
  // se respeta: sin efecto de profundidad, pero los datos del giroscopio se siguen contando.
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    diagnostico.orientacion += ' · reducir movimiento activado';
    addEventListener('deviceorientation', (e) => { if (e.beta != null) diagnostico.eventos++; });
    return;
  }
  let base = null, objetivo = { x: 0, y: 0 }, actual = { x: 0, y: 0 };
  const limitar = (v, m) => Math.max(-m, Math.min(m, v));

  addEventListener('deviceorientation', (e) => {
    if (e.beta == null) return;
    diagnostico.eventos++;
    base ??= { beta: e.beta, gamma: e.gamma };
    objetivo = { x: limitar(e.gamma - base.gamma, 25), y: limitar(e.beta - base.beta, 25) };
  });

  (function cuadro() {
    actual.x += (objetivo.x - actual.x) * 0.12;
    actual.y += (objetivo.y - actual.y) * 0.12;
    ancla.style.transform =
      `translate3d(${-actual.x * 2.2}px, ${-actual.y * 1.6}px, 0) ` +
      `rotateY(${actual.x * 0.6}deg) rotateX(${-actual.y * 0.5}deg)`;
    // Las imágenes de fondo se desplazan al revés y menos: parecen estar más lejos que la tarjeta
    $('#mundo').style.transform = `translate3d(${actual.x * 1.1}px, ${actual.y * 0.9}px, 0)`;
    requestAnimationFrame(cuadro);
  })();
}

async function pedirOrientacion() {
  // iOS 13+ (y versiones nuevas de Chrome) exigen permiso explícito, pedido dentro de un gesto del usuario.
  const DOE = window.DeviceOrientationEvent;
  if (typeof DOE?.requestPermission === 'function') {
    try {
      const ok = (await DOE.requestPermission()) === 'granted';
      diagnostico.orientacion = ok ? 'permitida (con permiso explícito)' : 'denegada (con permiso explícito)';
      return ok;
    } catch (e) { diagnostico.orientacion = `error al pedir permiso: ${e.name}`; return false; }
  }
  if (!('DeviceOrientationEvent' in window)) { diagnostico.orientacion = 'no disponible'; return false; }
  // Android/Chrome no pide permiso, pero el sitio puede tener bloqueados los "sensores de movimiento"
  try {
    const estados = await Promise.all(['accelerometer', 'gyroscope'].map((n) =>
      navigator.permissions?.query({ name: n }).then((r) => r.state).catch(() => 'desconocido')));
    diagnostico.orientacion = `sensores: ${estados.join(', ')}`;
    if (estados.includes('denied')) {
      avisar('Los sensores de movimiento están bloqueados para esta página: actívalos en ⋮ › Configuración del sitio');
      return false;
    }
  } catch { /* navegador sin Permissions API */ }
  return true;
}

// Si en 2 s no llega ningún dato del giroscopio, el teléfono no lo está entregando: se avisa
function vigilarSensores() {
  setTimeout(() => {
    if (diagnostico.eventos === 0 && CONFIG.MONTAJE === 'piso') {
      avisar('Tu teléfono no está enviando datos de movimiento: la flecha usará la dirección del mapa');
      setTimeout(() => avisar(''), 5000);
    }
  }, 2000);
}

function avisarFalloCamara(e) {
  const dentroDeApp = navegadorDentroDeApp();
  const enlace = enlaceAbrirEnNavegador();
  if (dentroDeApp && enlace) {
    const aviso = $('#aviso');
    aviso.replaceChildren('La cámara está bloqueada en este navegador. ',
      el('a', { href: enlace, style: 'color:#ffc34d;font-weight:600' }, 'Ábrela en Chrome'));
  } else if (dentroDeApp) {
    avisar('La cámara está bloqueada en este navegador: abre la página en Safari (botón “Abrir en el navegador”)');
  } else if (e?.name === 'NotAllowedError') {
    avisar('Permiso de cámara denegado: actívalo en la configuración del sitio y recarga');
  } else if (e?.name === 'NotReadableError') {
    avisar('La cámara está ocupada por otra app: ciérrala y recarga la página');
  } else {
    avisar('No se pudo abrir la cámara: mostrando sin realidad aumentada');
  }
}

// ============================================================================
// Su mundo: imágenes de contexto (curadas en contextos.json, con crédito de Commons)
// ============================================================================
let mundoVisible = false;

function montarMundo(imagenes) {
  if (!imagenes?.length) return;
  const capa = $('#mundo');
  const dur = CONFIG.SEGUNDOS_POR_IMAGEN + 2; // dura un poco más que la imagen: nunca se ve quieta
  const figuras = imagenes.map((img, k) => {
    // Enmarcada: imágenes pequeñas, o las que deben verse completas (p. ej. fotos de grupo)
    const enmarcada = img.completa || (img.ancho && img.ancho < 900);
    const kb = enmarcada ? 'kb-suave'
      : img.horizontal ? (k % 2 ? 'kb-paneo-izq' : 'kb-paneo-der')
      : (k % 2 ? 'kb-aleja' : 'kb-acerca');
    const fig = el('figure', { class: enmarcada ? 'enmarcada' : '', style: `--kb:${kb};--kb-dur:${dur}s` },
      enmarcada && el('img', { class: 'difusa', src: img.src, alt: '', decoding: 'async' }),
      el('img', { class: 'principal', src: img.src, alt: '', decoding: 'async' }));
    return fig;
  });
  capa.replaceChildren(...figuras);
  capa.classList.toggle('unica', figuras.length === 1);
  let i = 0;
  const mostrar = () => {
    figuras.forEach((f, k) => f.classList.toggle('activa', k === i));
    const img = imagenes[i];
    $('#pie-texto').replaceChildren(img.pie,
      el('small', {}, 'Foto: ', img.autor, ' · ',
        el('a', { href: img.pagina, target: '_blank', rel: 'noopener' }, img.licencia || 'ver licencia')));
  };
  mostrar();
  ajustarEnmarcadas();
  addEventListener('resize', ajustarEnmarcadas);
  if (figuras.length > 1) setInterval(() => { i = (i + 1) % figuras.length; mostrar(); }, CONFIG.SEGUNDOS_POR_IMAGEN * 1000);
  alternarMundo(true);
  document.body.classList.add('con-mundo');
  $('#pie-mundo').classList.add('visible');
}

// La foto enmarcada ocupa exactamente el espacio libre entre el pie de foto y la tarjeta
function ajustarEnmarcadas() {
  requestAnimationFrame(() => {
    const pie = $('#pie-mundo').getBoundingClientRect();
    const panel = contenido.querySelector('.panel')?.getBoundingClientRect();
    if (!panel) return;
    const dock = $('#dock').getBoundingClientRect();
    const alLado = panel.left > innerWidth * 0.3; // pantalla baja u horizontal: tarjeta a la derecha
    for (const fig of document.querySelectorAll('#mundo figure.enmarcada')) {
      const caja = fig.getBoundingClientRect(); // la capa es más grande que la pantalla (parallax)
      const img = fig.querySelector('img.principal');
      const arriba = pie.bottom + 12;
      const abajo = alLado ? dock.top - 12 : panel.top - 14;
      img.style.top = `${arriba - caja.top}px`;
      img.style.height = `${Math.max(80, abajo - arriba)}px`;
      img.style.left = `${(alLado ? 16 : innerWidth * 0.1) - caja.left}px`;
      img.style.width = `${alLado ? panel.left - 32 : innerWidth * 0.8}px`;
    }
  });
}

function alternarMundo(visible = !mundoVisible) {
  mundoVisible = visible;
  $('#mundo').classList.toggle('visible', visible);
  $('#pie-texto').hidden = !visible;
  const boton = $('#btn-mundo');
  boton.textContent = visible ? 'Ver cámara' : 'Ver su mundo';
  boton.setAttribute('aria-pressed', String(visible));
}

// ============================================================================
// Escuchar (síntesis de voz del propio teléfono)
// ============================================================================
// Voz latinoamericana y lo más neutra posible. La Web Speech API no informa el género de las voces,
// así que se reconoce por el nombre y se acerca el tono al centro: voces agudas un poco más graves,
// voces graves un poco más agudas.
const VOCES_AGUDAS = /paulina|m[oó]nica|soledad|isabela|ang[eé]lica|francisca|luciana|marisol|sabina|helena|laura|elvira|dalia|camila|valeria|flo\b|sandy|shelley|female|mujer/i;
const VOCES_GRAVES = /juan|jorge|diego|carlos|eddy|reed|rocko|jacobo|pablo|[aá]lvaro|ra[uú]l|gonzalo|enrique|andr[eé]s|male|hombre/i;
const VOCES_CARICATURA = /grandma|grandpa|bad news|bells|boing|bubbles|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|cellos/i;
const PREFERENCIA_LATAM = ['es-MX', 'es-US', 'es-419', 'es-CO', 'es-AR', 'es-CL', 'es-PE', 'es-VE', 'es-UY', 'es-EC', 'es-GT', 'es-CR'];

function elegirVoz() {
  const voces = window.speechSynthesis.getVoices().filter((v) => v.lang?.toLowerCase().startsWith('es') && !VOCES_CARICATURA.test(v.name));
  const norm = (l) => l.replace('_', '-').toLowerCase();
  const rango = (v) => {
    const i = PREFERENCIA_LATAM.findIndex((l) => norm(l) === norm(v.lang));
    return (i === -1 ? (norm(v.lang) === 'es-es' ? 90 : 50) : i)  // España al final
      // Una voz aguda llevada un poco más grave suena más neutra que una grave forzada hacia arriba
      + (VOCES_AGUDAS.test(v.name) ? 0 : VOCES_GRAVES.test(v.name) ? 0.4 : 0.2)
      + (v.localService ? 0 : 0.5);                                   // mejor sin depender de la red
  };
  const voz = voces.sort((a, b) => rango(a) - rango(b))[0] || null;
  const tono = !voz ? 1 : VOCES_AGUDAS.test(voz.name) ? 0.84 : VOCES_GRAVES.test(voz.name) ? 1.12 : 1;
  return { voz, tono };
}
window.speechSynthesis?.getVoices(); // algunos navegadores cargan la lista de voces en diferido
window.speechSynthesis?.addEventListener?.('voiceschanged', () => {});

function escuchar(texto, boton) {
  const sintesis = window.speechSynthesis;
  if (sintesis.speaking) {
    sintesis.cancel();
    return;
  }
  const u = new SpeechSynthesisUtterance(texto);
  const { voz, tono } = elegirVoz();
  u.voice = voz;
  u.lang = voz?.lang || 'es-MX';
  u.pitch = tono;
  u.rate = 0.95;
  const marcar = (activo) => {
    boton.textContent = activo ? '■' : '🔊';
    boton.setAttribute('aria-label', activo ? 'Detener' : 'Escuchar');
    boton.setAttribute('aria-pressed', String(activo));
  };
  u.onstart = () => marcar(true);
  u.onend = u.onerror = () => marcar(false);
  sintesis.speak(u);
}
addEventListener('pagehide', () => window.speechSynthesis?.cancel());

// ============================================================================
// Recorrido: pasaporte de calles visitadas + siguiente pin en el mapa del piso
// ============================================================================
function leerVisitas() {
  try { return new Set(JSON.parse(localStorage.getItem(CONFIG.CLAVE_VISITAS)) || []); } catch { return new Set(); }
}
function guardarVisitas(visitas) {
  try { localStorage.setItem(CONFIG.CLAVE_VISITAS, JSON.stringify([...visitas])); } catch { /* modo privado */ }
}

// ============================================================================
// Calibración automática: el QR del piso dice dónde está el norte del mapa
// ----------------------------------------------------------------------------
// Todos los QR se imprimieron derechos (su borde superior mira al norte del mapa). Si la cámara
// ve uno girado θ grados y la brújula del teléfono marca R, el norte del mapa está en R + θ.
// ============================================================================
let norteMapa = CONFIG.NORTE_MAPA_RUMBO ?? leerNorteGuardado();

const normalizar = (g) => ((g % 360) + 360) % 360;

function leerNorteGuardado() {
  try {
    const d = JSON.parse(localStorage.getItem(CONFIG.CLAVE_NORTE));
    return d && Date.now() - d.t < CONFIG.HORAS_CALIBRACION * 3600e3 ? d.grados : null;
  } catch { return null; }
}

function mediaCircular(grados) {
  const x = grados.reduce((s, g) => s + Math.cos(g * Math.PI / 180), 0);
  const y = grados.reduce((s, g) => s + Math.sin(g * Math.PI / 180), 0);
  return normalizar(Math.atan2(y, x) * 180 / Math.PI);
}

const diferencia = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

// Ángulo (sentido horario) del borde superior del QR respecto a la parte de arriba de la imagen.
// Devuelve null si no hay un QR del proyecto en el cuadro.
function giroDelQR(imagen) {
  const qr = window.jsQR?.(imagen.data, imagen.width, imagen.height, { inversionAttempts: 'dontInvert' });
  if (!qr || !qr.data.includes('calle_id=')) return null;
  const { topLeftCorner: a, topRightCorner: b } = qr.location;
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}

function cargarScript(src) {
  return new Promise((ok, error) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = error;
    document.head.append(s);
  });
}

async function calibrarConQR(video) {
  if (norteMapa != null) return;
  try { await cargarScript(CONFIG.JSQR_URL); } catch { return; } // sin red: queda la dirección "en el mapa"
  const lienzo = document.createElement('canvas');
  const ctx = lienzo.getContext('2d', { willReadFrequently: true });
  const muestras = [];
  const ciclo = setInterval(() => {
    if (norteMapa != null) return clearInterval(ciclo);
    // Hace falta brújula, video y el teléfono en vertical (en horizontal la imagen va girada)
    if (rumboTelefono == null || !video.videoWidth || (screen.orientation?.angle ?? 0) !== 0) return;
    const escala = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
    lienzo.width = Math.round(video.videoWidth * escala);
    lienzo.height = Math.round(video.videoHeight * escala);
    ctx.drawImage(video, 0, 0, lienzo.width, lienzo.height);
    const giro = giroDelQR(ctx.getImageData(0, 0, lienzo.width, lienzo.height));
    if (giro == null) return;
    muestras.push(normalizar(rumboTelefono + giro));
    if (muestras.length < 5) return;
    const media = mediaCircular(muestras);
    if (muestras.every((g) => diferencia(g, media) < 20)) { // lecturas estables: brújula sin interferencias
      norteMapa = media;
      try { localStorage.setItem(CONFIG.CLAVE_NORTE, JSON.stringify({ grados: media, t: Date.now() })); } catch { /* modo privado */ }
      avisar('Brújula calibrada con el mapa ✓');
      setTimeout(() => avisar(''), 3000);
      if (guia) pintarGuia();
      clearInterval(ciclo);
    } else {
      muestras.shift();
    }
  }, 350);
}

const RUMBOS = ['norte', 'noreste', 'este', 'sureste', 'sur', 'suroeste', 'oeste', 'noroeste'];
// En la pared el norte del mapa es "arriba": se habla de direcciones sobre el mapa, no cardinales
const DIRECCIONES_PARED = ['arriba', 'arriba a la derecha', 'a la derecha', 'abajo a la derecha', 'abajo',
  'abajo a la izquierda', 'a la izquierda', 'arriba a la izquierda'];
let rumboTelefono = null; // grados de brújula; null si el teléfono no la da
let guia = null;          // { datos, desde, hacia }

function vectorEnMapa(a, b) {
  // En el mapa impreso x crece hacia el este y y hacia el sur (cm)
  const dx = b.mapa_fisico.qr_x_cm - a.mapa_fisico.qr_x_cm;
  const dy = b.mapa_fisico.qr_y_cm - a.mapa_fisico.qr_y_cm;
  return { metros: Math.hypot(dx, dy) / 100, rumbo: (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360 };
}

function siguienteSugerida(datos, calleId, visitas) {
  const aqui = datos.calles[calleId];
  return Object.entries(datos.calles)
    .filter(([id, c]) => id !== calleId && !visitas.has(id) && c.mapa_fisico)
    .map(([id, c]) => ({ id, calle: c, ...vectorEnMapa(aqui, c) }))
    .sort((a, b) => a.metros - b.metros)[0] || null;
}

function guiarHacia(datos, calleId, destinoId) {
  const aqui = datos.calles[calleId];
  const destino = datos.calles[destinoId];
  if (!aqui?.mapa_fisico || !destino?.mapa_fisico) return;
  guia = { id: destinoId, calle: destino, ...vectorEnMapa(aqui, destino) };
  $('#sig-etiqueta').textContent = 'Te guío hacia';
  pintarGuia();
}

function pintarGuia() {
  const flecha = $('#flecha');
  if (!guia) {
    $('#sig-etiqueta').textContent = '¡Lo lograste!';
    $('#sig-nombre').textContent = 'Visitaste todas las calles';
    $('#sig-distancia').textContent = '';
    flecha.style.transform = '';
    return;
  }
  const enPared = CONFIG.MONTAJE === 'pared';
  const conBrujula = !enPared && norteMapa != null && rumboTelefono != null;
  const giro = conBrujula ? guia.rumbo + norteMapa - rumboTelefono : guia.rumbo;
  flecha.style.transform = `rotate(${giro}deg)`;
  $('#sig-nombre').textContent = guia.calle.mujer.nombre;
  const m = guia.metros < 1 ? `${Math.round(guia.metros * 100)} cm` : `${guia.metros.toFixed(1).replace('.', ',')} m`;
  const sector = Math.round(guia.rumbo / 45) % 8;
  $('#sig-distancia').textContent = conBrujula ? `${m} · sigue la flecha`
    : enPared ? `${m} ${DIRECCIONES_PARED[sector]}`
    : `${m} al ${RUMBOS[sector]} del mapa`;
}

function escucharBrujula() {
  const actualizar = (grados) => {
    rumboTelefono = (grados + 360) % 360;
    if (guia) pintarGuia();
  };
  addEventListener('deviceorientation', (e) => {
    if (typeof e.webkitCompassHeading === 'number') actualizar(e.webkitCompassHeading); // iOS
  });
  addEventListener('deviceorientationabsolute', (e) => {
    if (e.alpha != null) actualizar(360 - e.alpha); // Android
  });
}

function montarRecorrido(datos, calleId) {
  const visitas = leerVisitas();
  visitas.add(calleId);
  guardarVisitas(visitas);
  const total = Object.keys(datos.calles).length;
  $('#cuenta').textContent = `${visitas.size}/${total}`;
  guia = siguienteSugerida(datos, calleId, visitas);
  pintarGuia();
  $('#dock').classList.add('visible');
  $('#btn-pasaporte').onclick = () => abrirPasaporte(datos, calleId, visitas);
  $('#btn-siguiente').onclick = () => abrirPasaporte(datos, calleId, visitas);
}

function abrirPasaporte(datos, calleId, visitas) {
  const total = Object.keys(datos.calles).length;
  const fila = (id) => {
    const c = datos.calles[id];
    const visitada = visitas.has(id);
    return el('li', { class: visitada ? 'visitada' : '' }, el('span', {}, c.mujer.nombre),
      id === calleId ? el('small', {}, 'aquí estás')
        : visitada ? el('a', { href: `?calle_id=${encodeURIComponent(id)}` }, 'Volver a ver')
        : el('button', { type: 'button', onclick: () => { guiarHacia(datos, calleId, id); cerrarPasaporte(); } }, 'Guíame'));
  };
  const rutas = Object.entries(datos.temas || {}).map(([clave, nombre]) => {
    const ids = Object.keys(datos.calles).filter((id) => datos.calles[id].temas?.includes(clave));
    if (ids.length < 2) return null;
    const hechas = ids.filter((id) => visitas.has(id)).length;
    return el('section', {}, el('h3', {}, el('span', {}, nombre), el('span', {}, `${hechas}/${ids.length}`)),
      el('ul', {}, ids.map(fila)));
  });
  const visitadas = [...visitas].filter((id) => datos.calles[id]);
  $('#hoja-contenido').replaceChildren(
    el('p', { class: 'subtitulo' }, `Has descubierto ${visitadas.length} de ${total} calles del mapa.`),
    el('div', { class: 'progreso', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total),
      'aria-valuenow': String(visitadas.length) }, el('div', { style: `width:${(visitadas.length / total) * 100}%` })),
    el('h3', {}, 'Calles que ya visitaste'),
    el('ul', {}, visitadas.map(fila)),
    el('p', { class: 'subtitulo', style: 'margin-top:18px' }, 'Recorridos: elige a quién visitar y te guiamos sobre el mapa.'),
    ...rutas.filter(Boolean),
  );
  const hoja = $('#hoja');
  hoja.hidden = false;
  requestAnimationFrame(() => hoja.classList.add('abierta'));
  $('#btn-cerrar-hoja').focus();
}

function cerrarPasaporte() {
  const hoja = $('#hoja');
  hoja.classList.remove('abierta');
  setTimeout(() => { hoja.hidden = true; }, 350);
}

// ============================================================================
// Arranque
// ============================================================================
async function flujoDatos() {
  let calleId = leerCalleId();
  if (!calleId) {
    return () => pintar(panelError('Escanea un código QR',
      'Busca los códigos QR junto a las calles con nombre de mujer en el mapa y escanéalos con la cámara de tu teléfono.'));
  }

  const datos = await cargarDatos();
  // El QR impreso lleva un código corto de 3 caracteres; también se acepta el calle_id completo
  const calle = datos.calles?.[calleId] ?? Object.values(datos.calles || {}).find((c) => c.codigo === calleId);
  if (calle) calleId = calle.calle_id;
  if (!calle) {
    return () => pintar(panelError('Calle no encontrada',
      `No encontramos la calle “${calleId}”. Intenta escanear de nuevo el código QR.`));
  }
  $('#calle-previa').textContent = calle.mujer.nombre;
  document.title = `${calle.mujer.nombre} · Las Calles de las Mujeres`;

  const resultado = await resolverArticulo(calle.mujer);
  if (resultado.estado === 'existe') {
    return () => {
      pintar(panelArticulo(calle, resultado.resumen));
      $('#lector').textContent = `${calle.mujer.nombre}. ${resultado.resumen.extract}`;
      montarMundo(calle.contexto);
      montarRecorrido(datos, calleId);
    };
  }
  return () => {
    pintar(panelBrecha(calle, datos), { brecha: true });
    navigator.vibrate?.([60, 40, 60]);
    $('#lector').textContent = `${calle.mujer.nombre}. ${MENSAJE_BRECHA}`;
    montarMundo(calle.contexto);
    montarRecorrido(datos, calleId);
  };
}

// Los datos se piden en cuanto carga la página, en paralelo con la decisión
// de la persona sobre los permisos: al entrar a la escena ya suelen estar listos.
const datosListos = flujoDatos().catch((e) => {
  console.error(e);
  return () => pintar(panelError('Algo salió mal', 'No pudimos cargar la información. Revisa tu conexión e inténtalo de nuevo.'));
});

async function entrar(conCamara) {
  $('#portada').classList.add('oculta');
  if (conCamara) {
    const [orientacion] = await Promise.all([
      pedirOrientacion(),
      iniciarCamara().catch((e) => {
        console.warn(e);
        avisarFalloCamara(e);
      }),
    ]);
    if (orientacion) {
      iniciarAnclaje();
      vigilarSensores();
      if (CONFIG.MONTAJE === 'piso') {
        escucharBrujula();
        if ($('#camara').classList.contains('activa')) calibrarConQR($('#camara'));
      }
    }
  }
  (await datosListos)();
}

// ?diagnostico=1 → muestra qué pasa con cámara y sensores (para probar en teléfonos Android)
if (new URLSearchParams(location.search).has('diagnostico')) {
  const caja = el('pre', { style: 'position:fixed;left:8px;right:8px;top:8px;z-index:50;margin:0;padding:10px;pointer-events:none;opacity:.92;' +
    'background:rgba(0,0,0,.85);color:#9f9;font:12px/1.4 monospace;white-space:pre-wrap;border-radius:10px' });
  document.body.append(caja);
  setInterval(() => {
    caja.textContent = [
      `Navegador: ${navigator.userAgent}`,
      `Dentro de otra app: ${navegadorDentroDeApp() ? 'sí' : 'no'}`,
      `Cámara: ${diagnostico.camara} (intentos: ${diagnostico.intentos})`,
      `Movimiento: ${diagnostico.orientacion} · eventos recibidos: ${diagnostico.eventos}`,
      `Reducir movimiento: ${matchMedia('(prefers-reduced-motion: reduce)').matches ? 'sí' : 'no'}`,
      `Brújula: ${rumboTelefono == null ? 'sin datos' : Math.round(rumboTelefono) + '°'} · norte del mapa: ${norteMapa == null ? 'sin calibrar' : Math.round(norteMapa) + '°'}`,
    ].join('\n');
  }, 500);
}

$('#btn-ar').addEventListener('click', () => entrar(true));
$('#btn-sin-camara').addEventListener('click', () => entrar(false));
$('#btn-mundo').addEventListener('click', () => alternarMundo());
$('#btn-cerrar-hoja').addEventListener('click', cerrarPasaporte);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#hoja').hidden) cerrarPasaporte(); });
</script>
